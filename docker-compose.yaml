services:
  omnivoice-api:
    # Démarre uniquement si VITE_PROJECT_VOICE_CLONING_ENABLED=true (cf. COMPOSE_PROFILES)
    profiles: ["${VITE_PROJECT_VOICE_CLONING_ENABLED:-false}"]
    build: ./src/all-projects/project-voice-cloning/server
    container_name: omnivoice-api
    ports:
      - "${API_HOST_PORT}:${API_INTERNAL_PORT}"
    volumes:
      - ./src/all-projects/project-voice-cloning/server:/app
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN}
      - PORT=${API_INTERNAL_PORT}
      - FRONTEND_ORIGIN=http://localhost:${FRONTEND_PORT}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: python app.py
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  scouts-api:
    # Démarre uniquement si VITE_PROJECT_SCOUTS_ENABLED=true (cf. COMPOSE_PROFILES)
    profiles: ["${VITE_PROJECT_SCOUTS_ENABLED:-false}"]
    build: ./src/all-projects/project-scouts/server
    container_name: scouts-api
    ports:
      - "${SCOUTS_HOST_PORT}:${API_INTERNAL_PORT}"
    volumes:
      - ./src/all-projects/project-scouts/server:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=${API_INTERNAL_PORT}
      - POLL_INTERVAL=${SCOUTS_POLL_INTERVAL}
      - FRONTEND_ORIGIN=http://localhost:${FRONTEND_PORT}
    command: python scouts.py
    restart: unless-stopped

  portfolio-website:
    build: .
    container_name: portfolio-website
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0
    # Pas de depends_on sur les API : elles peuvent être désactivées via le .env,
    # et le serveur de dev Vite n'a pas besoin d'elles pour démarrer.
    restart: unless-stopped
