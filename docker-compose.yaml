services:
  omnivoice-api:
    build: ./src/all-projects/project-voice-cloning/server
    container_name: omnivoice-api
    ports:
      - "${API_HOST_PORT}:${API_INTERNAL_PORT}"
    volumes:
      - ./src/all-projects/project-voice-cloning/server:/app
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN}
      - PORT=${API_INTERNAL_PORT}
      - FRONTEND_ORIGIN=http://localhost:${FRONTEND_PORT}
    command: python app.py
    restart: unless-stopped

  portfolio-website:
    build: .
    container_name: portfolio-website
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - omnivoice-api
    restart: unless-stopped
